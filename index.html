<!doctype html>
<html lang="no">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Galton Kapital – kommer snart.">
    <meta name="theme-color" content="#101110">
    <title>Galton Kapital</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #101110;
        color: #f3f1eb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        min-height: 100svh;
        margin: 0;
        display: grid;
        place-items: center;
        background: #101110;
      }

      main {
        padding: 2rem;
        text-align: center;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.5rem, 8vw, 6rem);
        font-weight: 500;
        letter-spacing: 0.08em;
        line-height: 1;
        text-transform: uppercase;
      }

      p {
        margin: 1.25rem 0 0;
        color: #aaa9a3;
        font-size: clamp(1rem, 2vw, 1.25rem);
        font-weight: 400;
        letter-spacing: 0.04em;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Galton Kapital</h1>
      <p>Kommer snart...</p>
    </main>
  </body>
</html>
