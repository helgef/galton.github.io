<!doctype html>
<html lang="no">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Galton Kapital – kommer snart.">
  <meta name="theme-color" content="#101110">
  <title>Galton Kapital</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      background: #101110;
      color: #f3f1eb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      background: #101110;
    }

    main {
      padding: 2rem;
      text-align: center;
    }

    img {
      display: block;
      width: min(70vw, 350px);
      height: auto;
      margin: 0 auto 2rem;
      opacity: 0.7;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.5rem, 8vw, 6rem);
      font-weight: 800;
      color: #aaa9a3;
      letter-spacing: 0.08em;
      line-height: 1;
      text-transform: uppercase;
    }

    p {
      margin: 1.25rem 0 0;
      color: #aaa9a3;
      font-size: clamp(1rem, 2vw, 1.25rem);
      font-weight: 400;
      letter-spacing: 0.04em;
    }

    #logo p {
      text-align: right;
      font-style: italic;
    }

    #logo + p {
      margin-top: 10rem;
    }

    main.hidden {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.9s ease-in-out;
    }

    #coming-soon {
      position: fixed;
      color: #aaa9a3;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      opacity: 0;
      pointer-events: none;
      font-size: clamp(2rem, 6vw, 4rem);
      letter-spacing: 0.04em;
      transition: opacity 0.9s ease-in-out 0.4s;
      z-index: 1000;
    }

    #coming-soon.visible {
      opacity: 1;
    }
  </style>
</head>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-PMC6K5V4CF"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag() { dataLayer.push(arguments); }
  gtag('js', new Date());

  gtag('config', 'G-PMC6K5V4CF');
</script>

<body>
  <main>
    <img src="./galton-kapital-mark-cream.png" alt="">
    <div id="logo">
      <h1>Galton Kapital</h1>
      <p>Enkel avkastning</p>
    </div>
  </main>
  <div id="coming-soon">Kommer snart...</div>

  <script>
    document.addEventListener('click', function() {
      const main = document.querySelector('main');
      const comingSoon = document.getElementById('coming-soon');

      if (!main.classList.contains('hidden')) {
        main.classList.add('hidden');
        comingSoon.classList.add('visible');
      }
    });
  </script>
</body>

</html>
